```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cart | Brew & Bean</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="navbar">

    <a href="index.html" class="logo">
        ☕ Brew & Bean
    </a>

    <nav>

        <a href="index.html">Home</a>

        <a href="menu.html">Menu</a>

        <a href="cart.html">
            🛒 Cart
            <span id="cartCount">0</span>
        </a>

        <a href="contact.html">Contact</a>

    </nav>

</header>


<main>

    <section class="page-header">

        <p class="subtitle">YOUR ORDER</p>

        <h1>Shopping Cart 🛒</h1>

    </section>


    <section class="cart-section">

        <div id="cartContainer"></div>

        <div id="emptyCart"
             class="empty-state">

            <div>🛒</div>

            <h2>Your cart is empty</h2>

            <p>
                Add something delicious from our menu.
            </p>

            <a href="menu.html" class="btn">
                Go To Menu
            </a>

        </div>


        <div id="cartSummary"
             class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">

                <span>Subtotal</span>

                <span id="subtotal">
                    ₹0
                </span>

            </div>

            <div class="summary-row">

                <span>Delivery</span>

                <span id="delivery">
                    ₹40
                </span>

            </div>

            <hr>

            <div class="summary-row total">

                <span>Total</span>

                <span id="total">
                    ₹0
                </span>

            </div>

            <a href="checkout.html"
               class="btn full-btn">

                Proceed to Checkout

            </a>

        </div>

    </section>

</main>


<footer>

    <p>© 2026 Brew & Bean. All rights reserved.</p>

</footer>


<script src="js/common.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
```
