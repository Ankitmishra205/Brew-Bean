```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | Brew & Bean</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="navbar">

    <a href="index.html" class="logo">
        ☕ Brew & Bean
    </a>

    <nav>

        <a href="index.html">Home</a>

        <a href="menu.html">Menu</a>

        <a href="cart.html">
            🛒 Cart
            <span id="cartCount">0</span>
        </a>

        <a href="contact.html">Contact</a>

    </nav>

</header>


<main>

    <section class="page-header">

        <p class="subtitle">ALMOST THERE</p>

        <h1>Checkout</h1>

    </section>


    <section class="checkout-section">

        <form id="checkoutForm"
              class="checkout-form">

            <h2>Customer Details</h2>

            <label>
                Full Name
                <input
                    type="text"
                    id="name"
                    required
                >
            </label>


            <label>
                Phone Number
                <input
                    type="tel"
                    id="phone"
                    required
                >
            </label>


            <label>
                Email
                <input
                    type="email"
                    id="email"
                    required
                >
            </label>


            <label>
                Delivery Address
                <textarea
                    id="address"
                    rows="4"
                    required>
                </textarea>
            </label>


            <button
                type="submit"
                class="btn full-btn">

                Place Order

            </button>

        </form>


        <div class="checkout-summary">

            <h2>Order Summary</h2>

            <div id="checkoutItems"></div>

            <hr>

            <div class="summary-row total">

                <span>Total</span>

                <span id="checkoutTotal">
                    ₹0
                </span>

            </div>

        </div>

    </section>


    <div id="orderSuccess"
         class="success-message">

        🎉 Order placed successfully!

    </div>

</main>


<footer>

    <p>© 2026 Brew & Bean. All rights reserved.</p>

</footer>


<script src="js/common.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>
```
